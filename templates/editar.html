<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Editar Produto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">
  <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-sm border">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-xl font-black text-gray-800">Editar Produto #{{ p.id }}</h1>
      <a href="/admin" class="text-blue-600 font-bold hover:underline text-sm">&larr; Voltar ao Painel</a>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
      <input type="hidden" name="imagem_atual" value="{{ p.imagem_url }}">

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Título do Produto</label>
        <input type="text" name="titulo" value="{{ p.titulo }}" required class="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white font-medium">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Preço Final (R$)</label>
          <input type="text" name="preco" value="{{ p.preco }}" required class="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white font-bold text-green-700">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Preço Anterior (R$)</label>
          <input type="text" name="preco_original" value="{{ p.preco_original or '' }}" placeholder="Ex: 250,00" class="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white text-gray-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Desconto</label>
          <input type="text" name="desconto" value="{{ p.desconto or '' }}" class="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white font-semibold text-green-600">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Categoria</label>
          <input type="text" name="categoria" value="{{ p.categoria }}" class="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Marca</label>
          <input type="text" name="marca" value="{{ p.marca or '' }}" class="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Modelo</label>
          <input type="text" name="modelo" value="{{ p.modelo or '' }}" class="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Vendas (Ex: +500 vendidos)</label>
          <input type="text" name="vendas" value="{{ p.vendas or '' }}" class="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white font-semibold text-orange-600">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Forma de Pagamento / Parcelas</label>
        <input type="text" name="pagamento" value="{{ p.pagamento or '' }}" class="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Link de Afiliado</label>
        <input type="url" name="link_afiliado" value="{{ p.link_afiliado }}" required class="w-full border p-2.5 rounded-lg bg-gray-50 focus:bg-white font-mono text-xs text-blue-700">
      </div>

      <div class="border rounded-xl p-4 bg-gray-50 space-y-3">
        <span class="block text-xs font-bold text-gray-700 uppercase">Imagem do Produto:</span>
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 bg-white border rounded-lg p-1 flex items-center justify-center shrink-0">
            <img src="{{ p.imagem_url }}" alt="" referrerpolicy="no-referrer" class="max-h-full max-w-full object-contain">
          </div>
          <div class="flex-1 space-y-2">
            <p class="text-xs text-gray-500 font-semibold">Imagem salva atualmente. Deixe os campos abaixo em branco se não desejar alterar:</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
              <input type="url" name="imagem_url" placeholder="Nova URL (opcional)" class="w-full border p-2 rounded bg-white text-xs">
              <input type="file" name="imagem_upload" accept="image/*" class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-blue-100 file:text-blue-700">
            </div>
          </div>
        </div>
      </div>

      <div class="flex gap-4 pt-4">
        <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition">
          Salvar Alterações
        </button>
        <a href="/admin" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-lg text-center transition">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</body>
</html>
