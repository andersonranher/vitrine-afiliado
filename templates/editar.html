<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Editar Produto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow border">
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <h1 class="text-xl font-bold text-gray-800">Editar Produto #{{ p.id }}</h1>
      <a href="/admin" class="text-blue-600 text-sm font-semibold">&larr; Voltar ao Painel</a>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Título</label>
        <input type="text" name="titulo" value="{{ p.titulo }}" required class="w-full border p-2.5 rounded">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Preço (R$)</label>
          <input type="text" name="preco" value="{{ p.preco }}" required class="w-full border p-2.5 rounded">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Categoria</label>
          <input type="text" name="categoria" value="{{ p.categoria }}" class="w-full border p-2.5 rounded">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Link de Afiliado</label>
        <input type="url" name="link_afiliado" value="{{ p.link_afiliado }}" required class="w-full border p-2.5 rounded">
      </div>

      <!-- Alteração de Imagem -->
      <div class="border rounded-lg p-4 bg-gray-50 space-y-3">
        <label class="block text-sm font-bold text-gray-700">Foto Atual do Produto:</label>
        <div class="flex items-center gap-4">
          <img src="{{ p.imagem_url }}" alt="" referrerpolicy="no-referrer" class="w-20 h-20 object-contain bg-white border rounded">
          <div class="flex-1 space-y-2">
            <div>
              <label class="block text-xs font-semibold text-gray-600">Alterar por URL:</label>
              <input type="url" name="imagem_url" value="{{ p.imagem_url }}" class="w-full border p-2 rounded text-xs bg-white">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600">Ou fazer Upload de novo arquivo:</label>
              <input type="file" name="imagem_upload" accept="image/*" class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-blue-100 file:text-blue-700">
            </div>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Descrição</label>
        <textarea name="descricao" rows="3" class="w-full border p-2.5 rounded">{{ p.descricao }}</textarea>
      </div>

      <div class="flex gap-3">
        <button type="submit" class="flex-1 bg-green-600 text-white font-bold py-2.5 rounded hover:bg-green-700 shadow">
          Salvar Alterações
        </button>
        <a href="/admin" class="px-5 py-2.5 border rounded text-gray-700 text-center font-semibold hover:bg-gray-100">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</body>
</html>
